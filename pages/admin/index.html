<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>命灵 · 控制台</title>
    <link rel="stylesheet" href="./style.css?v=5.4.0" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="wrap">
      <header class="hero">
        <div class="brand">
          <div class="sigil">命</div>
          <div>
            <h1>命灵 <span id="version">5.4.0</span></h1>
            <p class="sub">1V1 状态层 · 自然语言意图 · 关系记忆</p>
          </div>
        </div>
        <div class="hero-actions">
          <span class="pill" id="healthPill">加载中</span>
          <button class="btn ghost" id="refreshBtn">刷新</button>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="overview">总览</button>
        <button class="tab" data-tab="users">用户与时间线</button>
        <button class="tab" data-tab="config">配置</button>
      </nav>

      <main>
        <section id="tab-overview" class="tab-content active">
          <div class="cards">
            <div class="card"><span class="card-label">已知用户</span><strong id="statUsers">–</strong><small>私聊触发过状态层</small></div>
            <div class="card"><span class="card-label">时间线文件</span><strong id="statFiles">–</strong><small id="statBytes">–</small></div>
            <div class="card"><span class="card-label">主动消息</span><strong id="statProactive">–</strong><small>每小时检查</small></div>
            <div class="card"><span class="card-label">语义兜底</span><strong id="statSemantic">–</strong><small id="statConfidence">–</small></div>
          </div>

          <div class="grid-2">
            <div class="panel">
              <div class="panel-head"><h2>运行状态</h2></div>
              <div class="kv" id="statusList"></div>
            </div>
            <div class="panel">
              <div class="panel-head"><h2>Cron 任务</h2></div>
              <div class="table-wrap"><table><thead><tr><th>名称</th><th>表达式</th><th>时区</th><th>状态</th></tr></thead><tbody id="cronBody"></tbody></table></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head"><h2>当前活动配置</h2><span class="muted">只读摘要，编辑请到「配置」</span></div>
            <div class="chips" id="configChips"></div>
          </div>
        </section>

        <section id="tab-users" class="tab-content">
          <div class="split">
            <div class="panel list-panel">
              <div class="panel-head"><h2>用户</h2><input id="userSearch" class="search" placeholder="搜索 UMO / 话题" /></div>
              <div class="user-list" id="userList"><div class="empty">暂无数据</div></div>
            </div>
            <div class="panel">
              <div class="panel-head">
                <h2 id="timelineTitle">时间线</h2>
                <div class="filters">
                  <select id="kindFilter">
                    <option value="">全部类型</option>
                    <option value="state_layer">状态层</option>
                    <option value="emotion">情绪</option>
                    <option value="memory_new">新记忆</option>
                    <option value="memory_reinforce">记忆强化</option>
                    <option value="topic_new">新话题</option>
                    <option value="topic_resume">话题恢复</option>
                    <option value="open_loop_new">未闭环</option>
                    <option value="open_loop_resolved">已闭环</option>
                    <option value="relationship_stage">关系阶段</option>
                    <option value="growth_reflect">成长反思</option>
                  </select>
                  <select id="limitSelect"><option value="50">50 条</option><option value="100" selected>100 条</option><option value="200">200 条</option><option value="500">500 条</option></select>
                </div>
              </div>
              <div id="timelineBox"><div class="empty">左侧选择一位用户查看时间线</div></div>
            </div>
          </div>
        </section>

        <section id="tab-config" class="tab-content">
          <form id="configForm" class="config-form">
            <div class="panel">
              <div class="panel-head"><h2>总开关与语义路由</h2></div>
              <div class="form-grid">
                <label class="switch"><input type="checkbox" data-key="enabled" data-type="bool" /><span>启用插件</span></label>
                <label class="switch"><input type="checkbox" data-key="semantic_router_enabled" data-type="bool" /><span>语义兜底识别</span></label>
                <label>置信度阈值<input type="number" step="0.05" min="0" max="1" data-key="semantic_router_confidence" data-type="float" /></label>
                <label>分类超时（秒）<input type="number" min="1" max="30" data-key="semantic_router_timeout" data-type="int" /></label>
                <label>最小字数<input type="number" min="1" max="20" data-key="semantic_router_min_chars" data-type="int" /></label>
              </div>
            </div>

            <div class="panel">
              <div class="panel-head"><h2>状态层</h2></div>
              <div class="form-grid">
                <label class="switch"><input type="checkbox" data-key="state_layer_enabled" data-type="bool" /><span>注入状态层</span></label>
                <label class="switch"><input type="checkbox" data-key="emotion_trace_enabled" data-type="bool" /><span>情绪轨迹</span></label>
                <label class="switch"><input type="checkbox" data-key="relationship_event_enabled" data-type="bool" /><span>关系事件</span></label>
                <label class="switch"><input type="checkbox" data-key="topic_stack_enabled" data-type="bool" /><span>话题栈</span></label>
                <label class="switch"><input type="checkbox" data-key="open_loop_enabled" data-type="bool" /><span>未闭环话题</span></label>
                <label class="switch"><input type="checkbox" data-key="relation_memory_enabled" data-type="bool" /><span>关系记忆</span></label>
                <label>Token 预算<input type="number" min="60" max="2000" data-key="state_layer_max_tokens" data-type="int" /></label>
                <label>记忆锚点上限<input type="number" min="0" max="10" data-key="state_layer_max_anchors" data-type="int" /></label>
              </div>
            </div>

            <div class="panel">
              <div class="panel-head"><h2>主动消息</h2></div>
              <div class="form-grid">
                <label class="switch"><input type="checkbox" data-key="proactive_enabled" data-type="bool" /><span>启用主动消息</span></label>
                <label>每日上限<input type="number" min="0" max="20" data-key="proactive_max_per_day" data-type="int" /></label>
                <label>免打扰开始<input type="number" min="0" max="23" data-key="proactive_quiet_start_hour" data-type="int" /></label>
                <label>免打扰结束<input type="number" min="0" max="23" data-key="proactive_quiet_end_hour" data-type="int" /></label>
                <label>情绪窗口（小时）<input type="number" min="1" max="168" data-key="proactive_mood_window_hours" data-type="int" /></label>
                <label>日常问候间隔（小时）<input type="number" min="1" max="72" data-key="proactive_daily_greet_min_gap_hours" data-type="int" /></label>
                <label>未闭环追问上限<input type="number" min="0" max="10" data-key="proactive_max_unanswered_open_loop" data-type="int" /></label>
                <label>日常未回复上限<input type="number" min="0" max="10" data-key="proactive_max_unanswered_daily" data-type="int" /></label>
                <label>未闭环窗口（天）<input type="number" min="1" max="90" data-key="open_loop_window_days" data-type="int" /></label>
              </div>
            </div>

            <div class="panel">
              <div class="panel-head"><h2>功能开关</h2></div>
              <div class="form-grid">
                <label class="switch"><input type="checkbox" data-key="counseling_enabled" data-type="bool" /><span>命理/开解</span></label>
                <label class="switch"><input type="checkbox" data-key="tarot_enabled" data-type="bool" /><span>塔罗</span></label>
                <label class="switch"><input type="checkbox" data-key="health_enabled" data-type="bool" /><span>健康建议</span></label>
                <label class="switch"><input type="checkbox" data-key="growth_engine_enabled" data-type="bool" /><span>成长反思</span></label>
                <label class="switch"><input type="checkbox" data-key="divination_tools_enabled" data-type="bool" /><span>命理工具可见</span></label>
                <label class="switch"><input type="checkbox" data-key="counseling_tools_enabled" data-type="bool" /><span>开解工具可见</span></label>
              </div>
            </div>

            <div class="panel">
              <div class="panel-head"><h2>记忆与时间线</h2></div>
              <div class="form-grid">
                <label>关系记忆上限<input type="number" min="20" max="1000" data-key="relation_memory_max_items" data-type="int" /></label>
                <label>情绪锚点阈值<input type="number" step="0.05" min="0" max="1" data-key="emotion_anchor_threshold" data-type="float" /></label>
                <label>情绪锚点倍率<input type="number" step="0.1" min="1" max="10" data-key="emotion_anchor_multiplier" data-type="float" /></label>
                <label>时间线读取上限<input type="number" min="50" max="5000" data-key="timeline_max_lines" data-type="int" /></label>
              </div>
            </div>

            <div class="panel">
              <div class="panel-head"><h2>命理计算服务</h2></div>
              <div class="form-grid">
                <label class="wide">服务地址<input type="text" data-key="mingbu_api_url" data-type="string" placeholder="http://192.168.2.77:2963" /></label>
              </div>
            </div>

            <div class="save-bar">
              <button type="submit" class="btn primary" id="saveBtn">保存配置</button>
              <button type="button" class="btn ghost" id="reloadBtn">重新读取</button>
              <span class="muted" id="saveHint"></span>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script type="module" src="./app.js?v=5.4.0"></script>
  </body>
</html>
