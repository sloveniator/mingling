# astrbot_plugin_mingbu — 工程化配置（P2-7：ruff + mypy 基线）
# 在隔离环境中通过 venv 安装 dev 工具：
#   python -m venv .venv && .venv/Scripts/python -m pip install pytest ruff mypy aiohttp
#   .venv/Scripts/python -m pytest tests/
#   .venv/Scripts/python -m ruff check .
#   .venv/Scripts/python -m mypy .

[project]
name = "astrbot-plugin-mingbu"
dynamic = ["version"]
description = "AstrBot 神秘 AI 朋友插件（含暗盘能力）"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9,<4.0"]

[project.optional-dependencies]
# 测试工具链：运行时不需要，仅本地/CI 跑 pytest 用。
# aiohttp 是唯一运行依赖（见 dependencies），pytest/pytest-asyncio 是测试期依赖。
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E=pycodestyle 错误, F=pyflakes(未定义/未使用), W=警告, I=import 排序
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # 长中文行交由 line-length 容忍；不强行拆行影响可读性

[tool.ruff.lint.per-file-ignores]
# 测试与桩文件放宽
"tests/*" = ["F401", "F811"]
# 部署诊断脚本：故意用「未使用的导入」做依赖可用性探测，且 import 不在文件顶部
"verify_hooks.py" = ["E402", "F401", "F811"]
# 插件入口：必须先向 sys.path 注入插件目录再 import 本地模块，import 不在文件顶部属预期
"main.py" = ["E402"]

[tool.setuptools.dynamic]
version = {attr = "_version.VERSION"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 异步用例均显式标注 @pytest.mark.asyncio（4 个文件共 19 个），strict 模式与之精确匹配，
# 且避免 auto 模式误把非 asyncio 的 async fixture/函数当协程跑。声明后标准 `pytest` 即可运行。
asyncio_mode = "strict"

[tool.mypy]
# 注：运行目标为 Python 3.9（AstrBot 环境），但 mypy 本体要求类型检查基线 >=3.10。
# 代码已用 `from __future__ import annotations` + `Optional[...]` 保证 3.9 运行时兼容，
# 此处仅将 mypy 基线设为 3.10 以通过工具链校验。
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

# 本项目为「扁平根模块 + 子包」混合布局：AstrBot 直接加载根 main.py（根无 __init__.py），
# 而 stars/apis 等子目录内部用包级相对导入回溯根模块。mypy 默认按磁盘目录推导模块名，
# 会把 core/feature_flags.py 与 integration/feature_flags.py 判为同名冲突，
# 也无法把 bare `from ... import x` 静态解析到无 __init__ 的根。
# 以下三项让 mypy 把「.」当作显式包基，扁平模块与子包统一按路径解析。
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

